name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      # SDK from global.json builds net8.0; the 8.0 runtime runs the tests.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ungrep.sln -c Release

      - name: Test
        run: dotnet test --solution ungrep.sln -c Release --no-build

      - name: Format
        run: dotnet format ungrep.sln --verify-no-changes

      # The launcher on the published build: version, doctor, one graph query.
      - name: Launcher
        shell: bash
        run: |
          dotnet publish src/Ungrep.Cli -c Release -o dist/ug
          bin/ug --version
          project="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/fixture"
          cp -R fixtures/CodeProject "$project"
          bin/ug doctor --project "$project"
          bin/ug refs Turntable.Rotated --project "$project" > refs.txt
          cat refs.txt
          grep -q "subscribed by" refs.txt
