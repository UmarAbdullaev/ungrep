<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="card-size" content="880x495">
<link rel="stylesheet" href="card.css">
<style>
  .card { height: 495px; padding: 0; }
  .path { position: absolute; left: 24px; top: 20px; font-size: 12px; color: var(--muted); }
  #art {
    position: absolute; left: 24px; top: 44px; width: 410px; height: 420px;
    font-size: 9.5px; line-height: 13.2px; white-space: pre; color: #262320; overflow: hidden;
  }
  #art b { font-weight: 700; }
  #art i { font-style: normal; font-weight: 700; color: #f4fde8; text-shadow: 0 0 6px rgba(94, 234, 212, 0.9), 0 0 16px rgba(190, 242, 100, 0.55); }
  .side { position: absolute; left: 470px; right: 36px; top: 58px; }
  .kicker { font-size: 13px; letter-spacing: 0.2em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .kicker i { width: 9px; height: 9px; border-radius: 50%; background: var(--a1); box-shadow: var(--glow); }
  h1 { font-size: 60px; line-height: 1; margin: 18px 0 0; font-weight: 700; letter-spacing: -0.03em; }
  .tag { font-size: 15.5px; margin: 14px 0 0; }
  .stats { display: flex; gap: 30px; margin-top: 28px; }
  .stat b { display: block; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .stat span { display: block; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .vs { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .and { margin-top: 24px; display: flex; align-items: baseline; gap: 12px; }
  .and em { font-size: 17px; color: var(--muted); }
  .and b { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 0 18px rgba(239, 232, 220, 0.25); }
  .and2 { font-size: 15px; margin-top: 4px; }
  .and3 { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .side .foot { position: absolute; top: 386px; font-size: 11.5px; }
</style>
</head>
<body>
<div class="card">
  <div class="path">~/ungrep</div>
  <div id="art"></div>

  <div class="side">
    <div class="kicker"><i></i>BETA 0.9 · CLAUDE CODE PLUGIN</div>
    <h1><span class="grad">un</span>grep</h1>
    <p class="tag">Grep reads text. ug reads the wiring.</p>
    <div class="stats">
      <div class="stat"><b>−43%</b><span>calls</span></div>
      <div class="stat"><b>−45%</b><span>tokens</span></div>
      <div class="stat"><b>−67%</b><span>per session</span></div>
    </div>
    <div class="vs">than Unity's own MCP, on the same editor tasks</div>
    <div class="and"><em>And</em><b>80 tokens</b></div>
    <div class="and2">is all ug adds to a conversation.</div>
    <div class="and3">Unity's MCP adds 1,509.</div>
    <div class="foot">Measured in a live Unity 6 editor. Details below.</div>
  </div>
</div>
<script>
  // The logo's cube, drawn in the faint prefab YAML and C# behind it: three faces, lit from the top.
  const source = `--- !u!1 &4410268329871204213 GameObject: m_ObjectHideFlags: 0 m_Name: Turntable m_TagString: Untagged m_IsActive: 1 m_Component: - component: {fileID: 4410268329871204214} - component: {fileID: 4410268329871204219} --- !u!114 &4410268329871204219 MonoBehaviour: m_GameObject: {fileID: 4410268329871204213} m_Enabled: 1 m_Script: {fileID: 11500000, guid: 7c1f3a9e0b2d4e6f8a1b2c3d4e5f60e2, type: 3} _speed: 2.5 _axis: {x: 0, y: 1, z: 0} Rotated: m_PersistentCalls: m_Calls: - m_Target: {fileID: 1180725364} m_MethodName: OnRotated m_Mode: 1 public sealed class Turntable : MonoBehaviour { [SerializeField] float _speed = 2.5f; [SerializeField] Vector3 _axis = Vector3.up; public event Action<float> Rotated; void Update() => Rotate(Time.deltaTime); void Rotate(float dt) { _speed = Mathf.Max(0, _speed); transform.Rotate(_axis, _speed * dt); Rotated?.Invoke(_speed); } public void Stop() { _speed = 0; } } --- !u!1001 &1180725360 PrefabInstance: m_Modification: m_TransformParent: {fileID: 0} m_Modifications: - target: {fileID: 4410268329871204219, guid: 2b9e41d07c5a4f1e9d3c6b8a7f0e1d24, type: 3} propertyPath: _speed value: 3 objectReference: {fileID: 0} - target: {fileID: 4410268329871204213, guid: 2b9e41d07c5a4f1e9d3c6b8a7f0e1d24, type: 3} propertyPath: m_Name value: Lab Turntable m_RemovedComponents: [] m_SourcePrefab: {fileID: 100100000, guid: 2b9e41d07c5a4f1e9d3c6b8a7f0e1d24, type: 3} fileFormatVersion: 2 guid: 7c1f3a9e0b2d4e6f8a1b2c3d4e5f60e2 MonoImporter: externalObjects: {} serializedVersion: 2 defaultReferences: [] executionOrder: 0 icon: {instanceID: 0} userData: assetBundleName: assetBundleVariant: public sealed class Spectator : MonoBehaviour { [SerializeField] Turntable _table; void OnEnable() => Watch(); void Watch() { _table.Rotated += OnRotated; _table.Rotated += s => Debug.Log(s); } void Leave() { _table.Rotated -= OnRotated; } void OnRotated(float speed) { } } `;
  const art = document.getElementById("art");
  const probe = document.createElement("span");
  probe.textContent = "M".repeat(100);
  art.appendChild(probe);
  const cw = probe.getBoundingClientRect().width / 100;
  art.textContent = "";
  const lh = parseFloat(getComputedStyle(art).lineHeight);
  const cols = Math.floor(art.clientWidth / cw), rows = Math.floor(art.clientHeight / lh);

  const W = cols * cw, H = rows * lh, cx = W / 2, cy = H / 2, R = Math.min(H * 0.43, W / Math.sqrt(3) * 0.92);
  const s3 = Math.sqrt(3);
  const spokes = [[-s3 / 2, -0.5], [s3 / 2, -0.5], [0, 1]];
  const gap = 7, nodeR = 19, ring = 14;
  const face = (x, y) => {
    const dx = x - cx, dy = y - cy;
    if (Math.abs(dx) > s3 / 2 * R || Math.abs(dx) / s3 + Math.abs(dy) > R) return null;
    const d = Math.hypot(dx, dy);
    if (d < nodeR) return "node";
    if (d < nodeR + ring) return "gap";
    for (const [ux, uy] of spokes) {
      const t = dx * ux + dy * uy;
      if (t > 0 && t < R && Math.abs(dx * uy - dy * ux) < gap) return "gap";
    }
    if (dy < -Math.abs(dx) / s3) return "top";
    return dx < 0 ? "left" : "right";
  };
  // Each face blends across the card from its left colour to its right one; the top is lightest.
  const shade = {
    top: [[0xcc, 0xfb, 0xf1], [0xec, 0xfc, 0xcb]],
    left: [[0x5e, 0xea, 0xd4], [0xa3, 0xe6, 0x35]],
    right: [[0x14, 0xb8, 0xa6], [0x65, 0xa3, 0x0d]],
  };
  const mix = ([a, b], t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;

  let text = source;
  while (text.length < cols * rows) text += source;
  let html = "";
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = text[r * cols + c];
      const f = face(c * cw + cw / 2, r * lh + lh / 2);
      if (!f) html += ch === "<" ? "&lt;" : ch === "&" ? "&amp;" : ch === ">" ? "&gt;" : ch;
      else if (f === "gap") html += " ";
      else if (f === "node") html += `<i>${ch === " " ? "·" : ch === "<" ? "&lt;" : ch === "&" ? "&amp;" : ch === ">" ? "&gt;" : ch}</i>`; // the logo's node, lit
      else {
        const shown = ch === " " ? "·" : ch === "<" ? "&lt;" : ch === "&" ? "&amp;" : ch === ">" ? "&gt;" : ch;
        html += `<b style="color:${mix(shade[f], c / cols)}">${shown}</b>`;
      }
    }
    html += "\n";
  }
  art.innerHTML = html;

</script>
</body>
</html>
